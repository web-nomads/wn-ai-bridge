services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WebNomads\WnAiBridge\:
    resource: '../Classes/*'
    exclude:
      # TYPO3 v14 only, registered from Services.php. Reflecting on it under v13
      # fails over ModuleAccessGateInterface, which does not exist there.
      - '../Classes/Backend/SubscriptionRequiredGate.php'
      # Registered from Services.php, where each one is tagged as an upgrade
      # wizard by hand. They have to be excluded here, not merely repeated
      # there: TYPO3 loads Services.php first and this file second, so a
      # resource-based definition landing on the same class afterwards replaces
      # the tagged one — and a wizard without its tag is a wizard the install
      # tool never sees. That is what kept all of them unlisted.
      - '../Classes/Upgrades/*'
      # Value objects — constructed from data, never injected.
      - '../Classes/Configuration/AssistantColorRoles.php'
      - '../Classes/Domain/Model/*'
      - '../Classes/Subscription/SubscriptionToken.php'
      - '../Classes/Subscription/SubscriptionStatus.php'
      - '../Classes/Subscription/SubscriptionKeyException.php'
      - '../Classes/Subscription/OnlineCheckResult.php'

  # Search providers, highest priority first (dedicated indexes before the
  # dependency-free page/content fallback). The tagged iterator is injected
  # into the SearchService. Third-party providers can join by tagging their
  # service with "wn_ai_bridge.search_provider".
  WebNomads\WnAiBridge\Search\KeSearchProvider:
    tags:
      - { name: 'wn_ai_bridge.search_provider', priority: 30 }

  WebNomads\WnAiBridge\Search\IndexedSearchProvider:
    tags:
      - { name: 'wn_ai_bridge.search_provider', priority: 20 }

  WebNomads\WnAiBridge\Search\PageContentSearchProvider:
    tags:
      - { name: 'wn_ai_bridge.search_provider', priority: 10 }

  WebNomads\WnAiBridge\Search\SearchService:
    arguments:
      $providers: !tagged_iterator wn_ai_bridge.search_provider

  WebNomads\WnAiBridge\Controller\LlmsTxtController:
    public: true

  WebNomads\WnAiBridge\Controller\AssistantWidgetController:
    public: true

  WebNomads\WnAiBridge\Controller\Backend\EnquiriesModuleController:
    public: true

  WebNomads\WnAiBridge\Controller\Backend\AnswersModuleController:
    public: true

  WebNomads\WnAiBridge\Controller\Backend\BotAccessModuleController:
    public: true

  # The subscription state is resolved once per request and cached in the
  # service, so it must be a single shared instance. Public so the
  # GeneralUtility::makeInstance() fallback in ConfigurationService gets that
  # same instance instead of building a second one.
  WebNomads\WnAiBridge\Subscription\SubscriptionService:
    shared: true
    public: true

  WebNomads\WnAiBridge\Subscription\SubscriptionOnlineCheck:
    shared: true
    public: true

  WebNomads\WnAiBridge\Middleware\RateLimiterMiddleware:
    public: true

  WebNomads\WnAiBridge\Middleware\AssistantRequestMiddleware:
    public: true

  WebNomads\WnAiBridge\Middleware\BotAccessLogMiddleware:
    public: true

  WebNomads\WnAiBridge\Middleware\LinkRelationMiddleware:
    public: true

  # Answers are generated through AiM; provider, model and key are configured there.
  WebNomads\WnAiBridge\Llm\LlmClientInterface:
    alias: WebNomads\WnAiBridge\Llm\AimClient

  WebNomads\WnAiBridge\Llm\AimResponseTracker:
    shared: true
    tags:
      - name: event.listener
        identifier: 'wn-ai-bridge/aim-response-tracker'
        event: B13\Aim\Event\AfterAiResponseEvent

  WebNomads\WnAiBridge\Command\DownloadMarkdownCommand:
    tags:
      - name: 'console.command'
        command: 'ai-bridge:download-markdown'
        description: 'Download TYPO3 pages as Markdown files'

  WebNomads\WnAiBridge\Command\CheckSubscriptionCommand:
    tags:
      - name: 'console.command'
        command: 'ai-bridge:check-subscription'
        description: 'Verify the subscription key and refresh its status with the issuing server'
